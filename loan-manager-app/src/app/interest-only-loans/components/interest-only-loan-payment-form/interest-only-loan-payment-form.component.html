<div class="container">
  <h2>Registrar Pago de Préstamo de Interés Simple</h2>
  <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="amount">Monto del Pago:</label>
      <input id="amount" type="number" step="0.01" formControlName="amount" class="form-control">
      <div *ngIf="formControls['amount'].touched && formControls['amount'].invalid">
        <small *ngIf="formControls['amount'].errors?.['required']">El monto es obligatorio.</small>
        <small *ngIf="formControls['amount'].errors?.['min']">El monto debe ser mayor que 0.</small>
      </div>
    </div>

    <div>
      <label for="paymentDate">Fecha del Pago:</label>
      <input id="paymentDate" type="date" formControlName="paymentDate" class="form-control">
      <div *ngIf="formControls['paymentDate'].touched && formControls['paymentDate'].invalid">
        <small *ngIf="formControls['paymentDate'].errors?.['required']">La fecha del pago es obligatoria.</small>
      </div>
    </div>

    <div>
      <label for="notes">Notas:</label>
      <input id="notes" type="text" formControlName="notes" class="form-control">
    </div>

    <div class="form-actions">
      <button type="submit" class="button button-primary" [disabled]="paymentForm.invalid">Registrar Pago</button>
      <button type="button" class="button button-secondary" (click)="cancel()">Cancelar</button>
    </div>
  </form>
</div>
