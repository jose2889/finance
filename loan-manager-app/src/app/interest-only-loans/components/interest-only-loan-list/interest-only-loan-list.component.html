<div class="container">
  <h2>Préstamos de Interés Simple (Tasa Mensual)</h2>
  <button (click)="navigateToAddLoan()" class="button add-button">
    Agregar Nuevo Préstamo
  </button>

  <ul *ngIf="loans.length > 0">
    <li *ngFor="let loan of loans">
      <div class="loan-details">
        <span><strong>Cliente:</strong> {{ loan.clientName }}</span>
        <span><strong>Monto:</strong> {{ formatCurrency(loan.loanAmount) }}</span>
        <span><strong>Tasa Interés:</strong> {{ (loan.monthlyInterestRate * 100).toFixed(2) }}%</span>
        <span><strong>Fecha Inicio:</strong> {{ formatDate(loan.startDate) }}</span>
      </div>
      <div class="loan-actions">
        <button (click)="viewDetails(loan.id)" class="button button-secondary button-small">
          Ver Detalles
        </button>
        <button (click)="makePayment(loan.id)" class="button button-success button-small">
          Registrar Pago
        </button>
        <button (click)="confirmDeleteLoan(loan.id)" class="delete-button button-small">
          Eliminar
        </button>
      </div>
    </li>
  </ul>

  <p class="no-items" *ngIf="loans.length === 0">No se encontraron préstamos de interés simple. ¡Agrega uno!</p>
</div>
