<div class="container">
  <h2>{{ isEditMode ? 'Edit Client' : 'Add New Client' }}</h2>
  <form [formGroup]="clientForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="firstName">First Name:</label>
      <input id="firstName" formControlName="firstName">
      <div *ngIf="formControls['firstName'].touched && formControls['firstName'].invalid">
        <small *ngIf="formControls['firstName'].errors?.['required']">First name is required.</small>
      </div>
    </div>
    <div>
      <label for="lastName">Last Name:</label>
      <input id="lastName" formControlName="lastName">
      <div *ngIf="formControls['lastName'].touched && formControls['lastName'].invalid">
        <small *ngIf="formControls['lastName'].errors?.['required']">Last name is required.</small>
      </div>
    </div>
    <div>
      <label for="email">Email:</label>
      <input id="email" type="email" formControlName="email">
       <div *ngIf="formControls['email'].touched && formControls['email'].errors?.['email']">
        <small>Invalid email format.</small>
      </div>
    </div>
    <div>
      <label for="phone">Phone:</label>
      <input id="phone" formControlName="phone">
    </div>
    <div>
      <label for="address">Address:</label>
      <textarea id="address" formControlName="address"></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="button button-primary" [disabled]="clientForm.invalid">{{ isEditMode ? 'Update' : 'Save' }} Client</button>
      <button type="button" class="button button-secondary" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
