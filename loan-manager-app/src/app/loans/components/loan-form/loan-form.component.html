<div class="container">
  <h2>Add New Loan</h2>
  <form [formGroup]="loanForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="clientId">Client:</label>
      <select id="clientId" formControlName="clientId">
        <option value="" disabled>Select a client</option>
        <option *ngFor="let client of clients" [value]="client.id">
          {{ client.firstName }} {{ client.lastName }}
        </option>
      </select>
      <div *ngIf="formControls['clientId'].touched && formControls['clientId'].errors?.['required']">
        <small>Client is required.</small>
      </div>
    </div>
    <div>
      <label for="loanAmount">Loan Amount:</label>
      <input id="loanAmount" type="number" formControlName="loanAmount">
      <div *ngIf="formControls['loanAmount'].touched && formControls['loanAmount'].invalid">
        <small *ngIf="formControls['loanAmount'].errors?.['required']">Amount is required.</small>
        <small *ngIf="formControls['loanAmount'].errors?.['min']">Amount must be positive.</small>
      </div>
    </div>
    <div>
      <label for="interestRate">Annual Interest Rate (e.g., 0.05 for 5%):</label>
      <input id="interestRate" type="number" step="0.001" formControlName="interestRate">
       <div *ngIf="formControls['interestRate'].touched && formControls['interestRate'].invalid">
        <small *ngIf="formControls['interestRate'].errors?.['required']">Rate is required.</small>
        <small *ngIf="formControls['interestRate'].errors?.['min']">Rate must be non-negative.</small>
        <small *ngIf="formControls['interestRate'].errors?.['max']">Rate must be less than or equal to 1 (100%).</small>
      </div>
    </div>
    <div>
      <label for="termMonths">Term (Months):</label>
      <input id="termMonths" type="number" formControlName="termMonths">
       <div *ngIf="formControls['termMonths'].touched && formControls['termMonths'].invalid">
        <small *ngIf="formControls['termMonths'].errors?.['required']">Term is required.</small>
        <small *ngIf="formControls['termMonths'].errors?.['min']">Term must be at least 1 month.</small>
      </div>
    </div>
    <div>
      <label for="startDate">Start Date:</label>
      <input id="startDate" type="date" formControlName="startDate">
      <div *ngIf="formControls['startDate'].touched && formControls['startDate'].errors?.['required']">
        <small>Start date is required.</small>
      </div>
    </div>
    <div>
      <label for="purpose">Purpose (Optional):</label>
      <input id="purpose" formControlName="purpose">
    </div>
    <div class="form-actions">
      <button type="submit" class="button button-primary" [disabled]="loanForm.invalid">Save Loan</button>
      <button type="button" class="button button-secondary" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
