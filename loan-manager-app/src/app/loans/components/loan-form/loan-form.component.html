<div class="container">
  <h2>Agregar Nuevo Préstamo</h2>
  <form [formGroup]="loanForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="clientId">Cliente:</label>
      <select id="clientId" formControlName="clientId" class="form-control">
        <option value="">-- Seleccione un cliente --</option>
        <option *ngFor="let client of clients" [value]="client.id">
          {{ client.firstName }} {{ client.lastName }}
        </option>
      </select>
      <div *ngIf="formControls['clientId'].touched && formControls['clientId'].invalid">
        <small *ngIf="formControls['clientId'].errors?.['required']">Debe seleccionar un cliente.</small>
      </div>
    </div>
    <div>
      <label for="loanAmount">Monto del Préstamo:</label>
      <input id="loanAmount" type="number" step="0.01" formControlName="loanAmount" class="form-control">
      <div *ngIf="formControls['loanAmount'].touched && formControls['loanAmount'].invalid">
        <small *ngIf="formControls['loanAmount'].errors?.['required']">El monto es obligatorio.</small>
        <small *ngIf="formControls['loanAmount'].errors?.['min']">El monto debe ser mayor que 0.</small>
      </div>
    </div>
    <div>
      <label for="interestRate">Tasa de Interés (%):</label>
      <input id="interestRate" type="number" step="0.01" formControlName="interestRate" class="form-control">
      <div *ngIf="formControls['interestRate'].touched && formControls['interestRate'].invalid">
        <small *ngIf="formControls['interestRate'].errors?.['required']">La tasa de interés es obligatoria.</small>
        <small *ngIf="formControls['interestRate'].errors?.['min']">La tasa debe ser mayor que 0.</small>
      </div>
    </div>
    <div>
      <label for="termMonths">Plazo (meses):</label>
      <input id="termMonths" type="number" formControlName="termMonths" class="form-control">
      <div *ngIf="formControls['termMonths'].touched && formControls['termMonths'].invalid">
        <small *ngIf="formControls['termMonths'].errors?.['required']">El plazo es obligatorio.</small>
        <small *ngIf="formControls['termMonths'].errors?.['min']">El plazo debe ser mayor que 0.</small>
      </div>
    </div>
    <div>
      <label for="startDate">Fecha de Inicio:</label>
      <input id="startDate" type="date" formControlName="startDate" class="form-control">
      <div *ngIf="formControls['startDate'].touched && formControls['startDate'].invalid">
        <small *ngIf="formControls['startDate'].errors?.['required']">La fecha de inicio es obligatoria.</small>
      </div>
    </div>
    <div>
      <label for="purpose">Propósito del Préstamo:</label>
      <input id="purpose" type="text" formControlName="purpose" class="form-control">
    </div>
    <div class="form-actions">
      <button type="submit" class="button button-primary" [disabled]="loanForm.invalid">Guardar Préstamo</button>
      <button type="button" class="button button-secondary" (click)="cancel()">Cancelar</button>
    </div>
  </form>
</div>
